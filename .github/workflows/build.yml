name: Build libskia_jni.so (aarch64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        run: |
          # Use the preinstalled NDK on the GitHub runner
          if [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK=$(ls -1d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          fi
          if [ -z "$NDK" ]; then
            # Fallback: download NDK r27c (has cpu-features.c in the zip)
            wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
            unzip -q android-ndk-r27c-linux.zip
            NDK="$HOME/android-ndk-r27c"
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at: $NDK"
          ls "$NDK/sources/android/cpufeatures/" 2>&1 || true

      - name: Build Skia + JNI .so
        env:
          SKIA_DIR: ${{ github.workspace }}/skia
          DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libskia_jni-aarch64
          path: libs/libskia_jni.so
          if-no-files-found: error
