name: Build libskia_jni.so (aarch64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build python3 git libfreetype-dev libfontconfig-dev

      - name: Set up Android NDK
        env:
          ANDROID_NDK_URL: https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        run: |
          if [ ! -d "$HOME/android-ndk-r29" ]; then
            wget -q "$ANDROID_NDK_URL"
            unzip -q android-ndk-r29-linux.zip
          fi
          echo "ANDROID_NDK=$HOME/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Build Skia + JNI .so
        env:
          SKIA_DIR: ${{ github.workspace }}/skia
          DEPOT_TOOLS: ${{ github.workspace }}/depot_tools
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libskia_jni-aarch64
          path: app/src/main/native/libs/libskia_jni.so
          if-no-files-found: error
